[model]
name = "laguna-s-2.1"
hf_id = "poolside/Laguna-S-2.1-GGUF"
model_type = "laguna"
architecture = "Hybrid Full/Sliding Attention + Dense/MoE"
parameters = "117.6B-A8.5B"
weight_format = "gguf_q4_k_m"
gguf_file = "laguna-s-2.1-Q4_K_M.gguf"
gguf_sha256 = "a34c74e46688122bef83122f4133031bababbefcf57436dde97048c91e2cc6ff"

layers_total = 48
layers_sliding_attention = 36
layers_full_attention = 12
layer_pattern = "1 full attention followed by 3 sliding attention"

hidden_dim = 3072
head_dim = 128
q_heads = 72
kv_heads = 8
intermediate_size = 12288
moe_experts = 256
moe_topk = 10
moe_intermediate = 1024
shared_expert_intermediate = 1024
moe_scoring_func = "sigmoid"
moe_routing_bias = true

rotary_dim = 64
rope_theta = 500000
partial_rotary_factor = 0.5
vocab_size = 100352
max_position_embeddings = 262144
sliding_window = 512
vision = false
mtp_layers = 0

[sampling.thinking_text]
temperature = 1.0
top_p = 0.95
top_k = 50
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.thinking_coding]
temperature = 1.0
top_p = 0.95
top_k = 50
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.non_thinking]
temperature = 1.0
top_p = 0.95
top_k = 50
presence_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[sampling.tools]
temperature = 1.0
top_p = 0.95
top_k = 50
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
dry_multiplier = 0.0

[behavior]
# Laguna's natural reasoning repetitions trigger Atlas's generic watchdogs and
# produce an invalid continuation after a forced </think>. Keep the validated
# GB10 policy for the Metal target.
enable_think_loop_watchdog = false
confidence_early_stop = false
rollback_resteer = false
min_p_floor = 0.1
temperature_max = 1.0
thinking_in_tools = true
max_thinking_budget = 8192
cap_thinking_at_max_tokens = false
thinking_default = true
# The first supported Metal profile uses BF16 KV; the GGUF has no calibrated
# FP8 KV scales.
default_kv_dtype = "bf16"
tool_call_parser = "poolside_v1"
use_sampling_presets_for_core = true
disable_cwd_hint_injection = true
max_inter_tool_prose = 2048

[[model_types]]
model_type = "laguna"
hidden_size = 3072
